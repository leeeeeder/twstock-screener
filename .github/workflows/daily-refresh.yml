name: Daily data refresh

# Fetches the exchange open data and commits the rebuilt artifact page.
#
# This runs here rather than inside the Claude cloud routine because that
# sandbox's egress proxy allowlists only development sources (anthropic.com,
# npm, pypi, crates) and refuses openapi.twse.com.tw / www.tpex.org.tw with
# "Tunnel connection failed: 403 Forbidden". GitHub-hosted runners have
# unrestricted outbound network, so the fetch happens here and the routine
# only has to clone and publish.

on:
  schedule:
    # 10:00 UTC = 18:00 Taipei, weekdays. The market closes at 13:30 but the
    # exchanges do not publish the daily files until roughly 14:00-15:00.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fetch data and rebuild pages
        run: python twstock_screener.py

      # A non-empty file is not proof of a good file: a run that lost one
      # exchange still writes a valid-looking page. Check both markets are
      # represented before anything gets committed.
      - name: Verify both markets are present
        run: |
          test -s output/artifact.html
          python - <<'PY'
          import json, re, sys
          html = open('output/artifact.html', encoding='utf-8').read()
          meta = json.loads(re.search(r'"meta":(\{.*?\}),"rows"', html).group(1))
          listed, otc = meta['listed'], meta['otc']
          print(f"資料日期 {meta['data_date']}  上市 {listed}  上櫃 {otc}")
          if listed < 900 or otc < 700:
              sys.exit(f"市場資料不完整（上市 {listed} / 上櫃 {otc}），不予提交。")
          PY

      - name: Commit the refreshed artifact
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/artifact.html
          # TPEx only ever serves the current day's ex-dividend rows, so this
          # accumulated file is the only copy that will ever exist.
          git add data/tpex_exright_history.json
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh screener data ($(date -u +%Y-%m-%d))"
            # The fetch takes minutes, so main may have moved since checkout.
            git pull --rebase --autostash origin main
            git push
          fi

      # index.html is the complete standalone document; artifact.html is a body
      # fragment that only works inside the Artifact wrapper, so never serve it.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp output/index.html _site/index.html
          cp output/twstock_*.csv _site/twstock_latest.csv

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
