name: Probe TWSE reachability

# Diagnostic only. curl reaches TWSE fine from a runner but the script's
# urllib calls come back as non-JSON, so isolate which request property the
# exchange objects to. Safe to delete once the question is settled.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compare user agents through urllib
        run: |
          python - <<'PY'
          import ssl, urllib.request, urllib.error

          ctx = ssl.create_default_context()
          ctx.verify_flags &= ~ssl.VERIFY_X509_STRICT

          URLS = {
            'openapi': 'https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL',
            'rwd': 'https://www.twse.com.tw/rwd/zh/exRight/TWT49U'
                   '?startDate=20250101&endDate=20251231&response=json',
          }
          AGENTS = {
            'script UA (suffixed)': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) twstock-screener/1.0',
            'plain browser UA':     'Mozilla/5.0 (Windows NT 10.0; Win64; x64)',
            'python default':       None,
          }

          for site, url in URLS.items():
              for label, ua in AGENTS.items():
                  headers = {'User-Agent': ua} if ua else {}
                  req = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=60, context=ctx) as r:
                          body = r.read()
                      head = body[:40].decode('utf-8', 'replace').replace('\n', ' ')
                      print(f"{site:8} | {label:22} | HTTP {r.status} | "
                            f"{len(body):>7} bytes | {head}")
                  except Exception as exc:
                      print(f"{site:8} | {label:22} | FAILED | {type(exc).__name__}: {exc}")
          PY
